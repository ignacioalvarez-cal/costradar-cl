[project]
name = "costradar-cl"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "ignacioalvarezcal", email = "ign.alvarezcal@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
costradar-cl = "costradar_cl:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "S",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
